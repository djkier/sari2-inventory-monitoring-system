<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Try the Sari2 account creation form.">
    <title>Sign Up | Sari2</title>
    <link rel="stylesheet" href="../../css/style.css">
    <link rel="stylesheet" href="../../css/public.css">
    <script src="../../js/auth.js" defer></script>
</head>
<body>
    <header class="site-header">
        <nav class="public-nav content-container" aria-label="Main navigation">
            <a class="brand" href="../../index.html" aria-label="Sari2 home">Sari<span>2</span></a>
            <div class="nav-links">
                <a class="nav-link" href="../../index.html">Home</a>
                <a class="nav-link" href="contact.html">Contact Us</a>
                <a class="btn-primary nav-login" href="login.html">Go to Login</a>
            </div>
        </nav>
    </header>
    <main class="login-section content-container">
        <section class="login-panel" aria-labelledby="signup-title">
            <p class="eyebrow">Welcome to Sari2</p>
            <h1 id="signup-title">Create an account</h1>
            <p class="login-introduction">Enter your details and choose your account type. All fields are required.</p>
            <noscript><p>Please enable JavaScript to use this form.</p></noscript>
            <form id="signup-form" novalidate>
                <fieldset id="signup-fields" disabled>
                    <legend class="visually-hidden">Account details</legend>
                    <div class="form-group">
                        <label for="signup-name">Full Name</label>
                        <input id="signup-name" name="name" type="text" autocomplete="name" required aria-describedby="signup-name-error">
                        <p class="field-error" id="signup-name-error"></p>
                    </div>
                    <div class="form-group">
                        <label for="signup-username">Username</label>
                        <input id="signup-username" name="username" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" required aria-describedby="signup-username-error">
                        <p class="field-error" id="signup-username-error"></p>
                    </div>
                    <div class="form-group">
                        <label for="signup-password">Password</label>
                        <input id="signup-password" name="password" type="password" autocomplete="new-password" required aria-describedby="signup-password-error">
                        <p class="field-error" id="signup-password-error"></p>
                    </div>
                    <div class="form-group">
                        <label for="signup-confirmation">Confirm Password</label>
                        <input id="signup-confirmation" name="confirmation" type="password" autocomplete="new-password" required aria-describedby="signup-confirmation-error">
                        <p class="field-error" id="signup-confirmation-error"></p>
                    </div>
                    <div class="form-group">
                        <label for="signup-role">Account Type</label>
                        <select id="signup-role" name="role" required aria-describedby="signup-role-error">
                            <option value="">Select an account type</option>
                            <option value="Store Owner">Store Owner</option>
                            <option value="Store Staff">Store Staff</option>
                        </select>
                        <p class="field-error" id="signup-role-error"></p>
                    </div>
                    <button class="btn-primary" type="submit">Sign Up</button>
                </fieldset>
            </form>
            <a class="login-home" href="login.html">Return to Login</a>
        </section>
    </main>
    <footer class="site-footer">
        <div class="content-container footer-content">
            <p><strong>Sari2</strong> &middot; Inventory Monitoring System</p>
            <p>&copy; 2026 Sari2</p>
        </div>
    </footer>
</body>
</html>

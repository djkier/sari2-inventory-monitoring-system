<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings | Sari2</title>
    <link rel="stylesheet" href="../../css/style.css">
    <link rel="stylesheet" href="../../css/app.css">
    <script src="../../js/storage.js" defer></script>
    <script src="../../js/auth.js" defer></script>
    <script src="../../js/app.js" defer></script>
    <script src="../../js/settings.js" defer></script>
</head>
<body>
    <noscript><p>Please enable JavaScript and <a href="../frontfacing/login.html">log in</a> to access Sari2.</p></noscript>
    <div id="app-shell" class="app-shell" hidden>
        <aside class="app-sidebar">
            <a class="app-brand" href="dashboard.html">Sari<span>2</span></a>
            <p class="app-sidebar-label">Inventory management</p>
            <nav class="app-nav" aria-label="Application navigation">
                <a href="dashboard.html">Dashboard</a>
                <a href="products.html">Products</a>
                <a href="stock.html">Stock Movement</a>
                <a href="expiration.html">Expiration</a>
            </nav>
            <nav class="app-nav app-nav-secondary" aria-label="Account and settings">
                <a href="settings.html" aria-current="page">Settings</a>
                <button id="logout-button" type="button">Logout</button>
            </nav>
            <p id="app-feedback" class="field-error" role="alert"></p>
        </aside>
        <div class="app-workspace">
            <header class="app-header">
                <p id="store-name"></p>
                <div class="app-user" aria-label="Logged-in user">
                    <strong id="current-user-name"></strong>
                    <span id="current-user-role"></span>
                </div>
            </header>
            <main class="app-content">
                <h1>Settings</h1>
                <p class="app-introduction">Manage your store information and inventory preferences.</p>

            </main>
        </div>
        
    </div>
</body>
</html>
